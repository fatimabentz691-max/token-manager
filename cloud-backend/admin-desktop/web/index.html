<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Token Manager Admin</title>
  <style>
    :root{font-family:"SF Pro Text","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7}
    body{display:grid;min-height:100vh;margin:0;place-items:center}.state{padding:28px;border-radius:16px;background:#fff;text-align:center}.state i{display:block;width:22px;height:22px;margin:0 auto 14px;border:2px solid #d2d2d7;border-top-color:#1d1d1f;border-radius:50%;animation:spin .8s linear infinite}.state b,.state span{display:block}.state span{margin-top:7px;color:#6e6e73;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><div class="state"><i></i><b>正在连接 Token Manager 后台</b><span>需要可访问公网管理服务</span></div></body>
</html>
