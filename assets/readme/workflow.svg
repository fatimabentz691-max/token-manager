<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Token Manager 本地数据链路</title>
  <desc id="desc">Codex 和 Claude Code 本地日志、模型 API 与账单导入进入本地标准化层，再输出仪表盘、悬浮窗、预警和 Excel 报告。</desc>
  <rect width="1200" height="330" rx="28" fill="#f7f7f9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="54" y="58" fill="#1d1d1f" font-size="34" font-weight="760">一条本地链路，四种可信来源</text>
    <text x="54" y="88" fill="#86868b" font-size="18">只有数据源确实提供的信息才会被标成余额或官方额度。</text>
    <g transform="translate(54 124)" font-size="19" font-weight="680">
      <rect width="208" height="68" rx="17" fill="#ffffff"/>
      <text x="22" y="31" fill="#1d1d1f">Codex / Claude</text><text x="22" y="53" fill="#86868b" font-size="15">本地 usage 与 rate_limits</text>
      <rect y="84" width="208" height="68" rx="17" fill="#ffffff"/>
      <text x="22" y="115" fill="#1d1d1f">模型 API</text><text x="22" y="137" fill="#86868b" font-size="15">本机代理 usage</text>
      <rect x="236" width="208" height="68" rx="17" fill="#ffffff"/>
      <text x="258" y="31" fill="#1d1d1f">官方余额</text><text x="258" y="53" fill="#86868b" font-size="15">仅限已验证且有权限的接口</text>
      <rect x="236" y="84" width="208" height="68" rx="17" fill="#ffffff"/>
      <text x="258" y="115" fill="#1d1d1f">账单导入</text><text x="258" y="137" fill="#86868b" font-size="15">平台导出的消费记录</text>
    </g>
    <path d="M512 200H588" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
    <path d="m578 190 10 10-10 10" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(610 128)">
      <rect width="224" height="144" rx="24" fill="#0b0b0c"/>
      <g transform="translate(22 22)">
        <rect width="42" height="42" rx="13" fill="#ffffff"/>
        <rect x="11" y="20" width="5" height="13" rx="2.5" fill="#0b0b0c"/><rect x="19" y="11" width="5" height="22" rx="2.5" fill="#0b0b0c"/><rect x="27" y="15" width="5" height="18" rx="2.5" fill="#0b0b0c"/>
        <text x="56" y="27" fill="#ffffff" font-size="22" font-weight="760">本地标准化层</text>
      </g>
      <text x="22" y="92" fill="#d1d1d6" font-size="17">SQLite · DPAPI · 定价版本</text>
      <text x="22" y="119" fill="#8e8e93" font-size="16">不保存请求与响应正文</text>
    </g>
    <path d="M856 200H924" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
    <path d="m914 190 10 10-10 10" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(946 124)" font-size="19" font-weight="680">
      <text x="0" y="22" fill="#1d1d1f">仪表盘与图表</text>
      <text x="0" y="58" fill="#1d1d1f">常驻悬浮窗</text>
      <text x="0" y="94" fill="#1d1d1f">预算与异常预警</text>
      <text x="0" y="130" fill="#1d1d1f">分类 Excel 账单</text>
    </g>
  </g>
</svg>
