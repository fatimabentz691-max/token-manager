<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Token Manager v0.10.4</title>
  <desc id="desc">面向 Windows 开发者的本地 AI Token、请求、缓存、余额与成本控制中心。</desc>
  <rect width="1200" height="420" rx="32" fill="#0b0b0c"/>
  <g transform="translate(58 52)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
